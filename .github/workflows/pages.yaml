name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Pinned exact -- no third-party marketplace action installs this; mkdocs
  # itself and pymdown-extensions come along as mkdocs-material's own
  # dependencies, unpinned, resolved by pip at install time.
  MKDOCS_MATERIAL_VERSION: "9.7.7"

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mkdocs-material ${{ env.MKDOCS_MATERIAL_VERSION }}
        run: pip install "mkdocs-material==${{ env.MKDOCS_MATERIAL_VERSION }}"

      - name: Build site (strict -- fails on any warning, e.g. broken links)
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
