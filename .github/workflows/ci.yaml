name: CI

on:
  push:
    branches: [main]
    # The demo.yaml workflow's own bot commits touch only assets/cli.gif;
    # skip full CI for those (they carry no code, so nothing here would
    # catch anything) and to avoid an unnecessary run on every demo GIF
    # regeneration.
    paths-ignore:
      - "assets/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  # Pinned to match the versions in use on the dev machine (`golangci-lint
  # version`, `go version -m $(which gosec)`, `govulncheck -version`) so CI
  # enforces exactly what `make lint` enforces locally -- no drift from an
  # unpinned tool picking up a newer/stricter release on its own schedule.
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GOSEC_VERSION: "v2.29.0"
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  go:
    name: Go (lint, security, race tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # web/embed.go has `//go:embed all:public`; web/public is entirely
      # gitignored (it's Hugo's build output), so a fresh checkout has no
      # web/public directory at all and every step below that compiles the
      # module (golangci-lint, gosec, govulncheck, go test) fails with
      # "pattern all:public: no matching files found" without this.
      - name: Web placeholder (go:embed needs web/public to exist)
        run: make web-presence

      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: "golangci-lint (config: .golangci.yml)"
        run: golangci-lint run

      - name: Install gosec ${{ env.GOSEC_VERSION }}
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: gosec
        run: gosec ./...

      - name: Install govulncheck ${{ env.GOVULNCHECK_VERSION }}
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: govulncheck
        run: govulncheck ./...

      - name: go test -race
        run: go test -race ./...

  drift:
    name: Codegen drift (OpenAPI server + TS types)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Regenerate OpenAPI server code and check for drift
        run: |
          make generate
          git diff --exit-code -- internal/api/gen/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Regenerate TS types and check for drift
        run: |
          make web-types
          git diff --exit-code -- web/assets/ts/gen/

  web:
    name: Web (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Type-check (regenerates types, then tsc --noEmit)
        run: make web-check

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (VERSION=ci)
        run: make docker-build VERSION=ci
