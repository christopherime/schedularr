tunarr:
  url: "http://localhost:8000"
  api_key: ""

log:
  level: "debug"
  format: "text"

# Set by e2e/test.sh to an absolute path before every invocation -- the
# scheduler.yaml import file is picked up by config's scheduler_file key,
# not a CLI flag (see `schedularr generate`'s --help).
scheduler_file: "${SCHEDULER_FILE}"

