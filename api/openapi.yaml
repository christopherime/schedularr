openapi: 3.0.3
info:
  title: Schedularr API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /blocks:
    get:
      operationId: listBlocks
      responses:
        "200":
          $ref: "#/components/responses/BlockList"
    post:
      operationId: createBlock
      requestBody:
        $ref: "#/components/requestBodies/BlockWrite"
      responses:
        "201":
          $ref: "#/components/responses/BlockItem"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /blocks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBlock
      responses:
        "200":
          $ref: "#/components/responses/BlockItem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateBlock
      description: >-
        Replaces the block's whole spec, so it requires `If-Match` to
        carry the `updated_at` the client last read. Without it two tabs
        editing one block silently discard the slower operator's work --
        which the live link makes routine rather than theoretical, since
        both tabs now see each other's changes land. Use `PATCH` for a
        field-scoped write that cannot lose an unrelated edit.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: >-
            The block's current `updated_at`, as returned by GET, optionally
            quoted. A mismatch means someone else saved since this client
            last read, and the write is refused rather than discarding
            their edit.
      requestBody:
        $ref: "#/components/requestBodies/BlockWrite"
      responses:
        "200":
          $ref: "#/components/responses/BlockItem"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchBlock
      description: >-
        Field-scoped write for toggles. Only fields present in the body
        change, so this cannot discard an unrelated edit the way a
        full-spec PUT can -- which is also why it needs no `If-Match`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockPatch"
      responses:
        "200":
          $ref: "#/components/responses/BlockItem"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteBlock
      responses:
        "204":
          description: deleted
        "404":
          $ref: "#/components/responses/Problem"
  /blocks/{id}/duplicate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: duplicateBlock
      summary: Copy a block into a new, disabled one
      description: >-
        Copies the source block's whole spec -- filter, filler, series
        seeds and all -- into a new block under the name the caller
        gives. It exists because a working set of blocks is usually one
        block varied a few ways, and rebuilding a series roster field by
        field to change one channel is where operators give up and edit
        the database.

        Nothing keyed by the source's id comes along: series cursors and
        occurrence snapshots record what the SOURCE has already aired,
        and a copy has aired nothing.

        The copy arrives `enabled: false`. An exact copy carries the same
        cron, channel, and priority as its source, so landing it enabled
        would put two blocks in contention for one channel at one time
        and conflict resolution would silently drop one of them. The copy
        is a draft the operator edits and then turns on.

        The name is required and the server never invents one -- a
        collision is the caller's to resolve, not something a server-side
        counter should paper over. Clients pre-fill `Copy of <source>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockDuplicate"
      responses:
        "201":
          $ref: "#/components/responses/BlockItem"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /blocks/import:
    post:
      operationId: importBlocks
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      parameters:
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
  /blocks/export:
    get:
      operationId: exportBlocks
      responses:
        "200":
          description: yaml
          content:
            application/yaml:
              schema:
                type: string
  /generate:
    post:
      operationId: generateSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResult"
        "502":
          $ref: "#/components/responses/Problem"
  /apply:
    post:
      operationId: applySchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: applied plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResult"
        "502":
          $ref: "#/components/responses/Problem"
  /schedule:
    get:
      operationId: getSchedule
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 30
        - name: channel_id
          in: query
          description: >-
            Restrict planning to this channel (parity with
            GenerateRequest.channel_id) -- when set, only blocks targeting
            this channel are planned at all. Omitted means every channel.
          schema:
            type: string
      responses:
        "200":
          description: plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResult"
        "502":
          $ref: "#/components/responses/Problem"
  /history:
    get:
      operationId: getHistory
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"
    delete:
      operationId: deleteHistoryRange
      description: >-
        Deletes airings inside a window. Exactly one window form is
        required: `before`, or `from` with `to`. An occurrence left with
        no airings keeps a marker saying it was committed and produced
        nothing, so a later apply does not re-plan a slot that already
        went out.

        Cursors and snapshots are untouched -- a date range is not a
        statement about any particular show. Use DELETE
        /state/series/{show_title} for that.

        This cannot be undone, and nothing backfills it.
      parameters:
        - name: before
          in: query
          schema:
            type: string
            format: date-time
          description: Delete everything scheduled before this instant. Mutually exclusive with from/to.
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: channel_id
          in: query
          schema:
            type: string
        - name: block_name
          in: query
          schema:
            type: string
        - name: show_title
          in: query
          schema:
            type: string
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: what was deleted, or would be
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovalReport"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /storage:
    get:
      operationId: getStorage
      description: >-
        Row counts per table, and the span the stored airings cover.
        Reports what IS stored, not what retention says should be: a
        database whose retention was widened holds whatever it holds.
      responses:
        "200":
          description: storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageReport"
  /events:
    get:
      operationId: streamEvents
      summary: Server-sent event stream of live changes
      description: >-
        A `text/event-stream` of change events, one connection per browser
        tab. Carries a `heartbeat` every 15 seconds whose `server_time`
        lets a client correct its own clock drift; the heartbeat also
        keeps bytes flowing so an intermediary proxy cannot buffer the
        connection into uselessness. Supports `Last-Event-ID` resume from
        a small in-memory ring buffer -- a resume point older than the
        ring replays only what survives, and the client refetches for the
        rest.

        Event names: `heartbeat`, `apply.completed`, `plan.invalidated`,
        `status.changed`, `series.changed`.

        Consumed by a hand-rolled fetch/ReadableStream reader, never by
        `EventSource`, which cannot send the Authorization header. A
        token-in-query alternative is permanently out of scope: it would
        leak the token into access logs.

        Nothing in the UI requires this stream. Every page stays fully
        operable with a manual refresh when it is unavailable, which is
        also what the client's degradation ladder falls back to.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: The id of the last event this client processed.
      responses:
        "200":
          description: The event stream, which does not complete while connected.
          content:
            text/event-stream:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/Problem"
  /applies:
    get:
      operationId: listApplyRuns
      description: >-
        Recorded applies, newest first. One row per apply -- UI, cron
        loop, and CLI alike -- with the conflict warnings that apply
        dropped. Runs cannot be backfilled: nothing exists from before
        the migration that created the table.
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: apply runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplyRun"
        "400":
          $ref: "#/components/responses/Problem"
  /state/series:
    get:
      operationId: listSeriesState
      responses:
        "200":
          description: states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeriesState"
  /state/series/{show_title}:
    parameters:
      - name: show_title
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeSeriesState
      description: >-
        Removes every trace of one show's progression: its cursor, its
        airings, and its keys inside every occurrence snapshot, in one
        transaction. Occurrences left with no airings stay committed and
        empty rather than reading as never planned.

        REFUSED WHILE A BLOCK STILL LISTS THE SHOW. The next apply would
        re-add it from the block spec and reset the cursor this just
        deleted, so the refusal names the blocks to edit first in the
        problem's `blocks` member.

        This cannot be undone, and nothing backfills it.
      parameters:
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: false
          description: Report what would be removed without removing it.
      responses:
        "200":
          description: what was removed, or would be
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovalReport"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchSeriesState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesStatePatch"
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesState"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /cron/next:
    get:
      operationId: nextCronOccurrences
      summary: Upcoming occurrences of a cron expression
      description: >-
        The next occurrences of `expr`, evaluated server-side in the
        configured `log.timezone`. It exists so the client never
        re-implements calendar semantics: DST transitions, month lengths,
        and descriptor handling all belong to one parser, the same one the
        scheduling engine uses.

        Occurrences are strictly AFTER `from`, so a `from` sitting exactly
        on an occurrence does not return it again. The array may be shorter
        than `count`: a well-formed expression that never fires (February
        30th) returns an empty array rather than an error, because the
        expression is valid and the answer is genuinely "never".

        Stateless -- it reads no blocks and touches no store.
      parameters:
        - name: expr
          in: query
          required: true
          schema:
            type: string
          description: A standard 5-field cron expression, or a descriptor such as `@daily`.
        - name: count
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: RFC3339 instant to search after. Defaults to now.
      responses:
        "200":
          description: The upcoming occurrences, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [occurrences]
                properties:
                  occurrences:
                    type: array
                    items:
                      type: string
                      format: date-time
        "400":
          $ref: "#/components/responses/Problem"
  /channels:
    get:
      operationId: listChannels
      responses:
        "200":
          description: channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "502":
          $ref: "#/components/responses/Problem"
  /status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /media/shows:
    get:
      operationId: listMediaShows
      responses:
        "200":
          description: shows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaShow"
        "502":
          $ref: "#/components/responses/Problem"
  /media/meta:
    get:
      operationId: getMediaMeta
      responses:
        "200":
          description: meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaMeta"
        "502":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  requestBodies:
    BlockWrite:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BlockWrite"
  responses:
    Problem:
      description: error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BlockList:
      description: blocks
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BlockRecord"
    BlockItem:
      description: block
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BlockRecord"
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        request_id:
          type: string
    Filter:
      type: object
      properties:
        title_pattern:
          type: string
        genres:
          type: array
          items:
            type: string
        ratings:
          type: array
          items:
            type: string
        year_from:
          type: integer
        year_to:
          type: integer
        min_duration:
          type: integer
        max_duration:
          type: integer
        tags:
          type: array
          items:
            type: string
    FillerConfig:
      type: object
      properties:
        enabled:
          type: boolean
        filler_list_id:
          type: string
        max_filler_time:
          type: integer
        min_gap_time:
          type: integer
    SeriesConfig:
      type: object
      required: [show_title, episodes_per_block]
      properties:
        show_title:
          type: string
        episodes_per_block:
          type: integer
          minimum: 1
        start_season:
          type: integer
        start_episode:
          type: integer
        on_complete:
          type: string
          enum: [continue, restart, disable]
        skip_episodes:
          type: array
          items:
            type: string
        max_runs:
          type: integer
    SeriesFallback:
      type: object
      properties:
        mode:
          type: string
          enum: [redistribute, filler]
        filler_filter:
          $ref: "#/components/schemas/Filter"
    BlockSpec:
      type: object
      required: [name, cron, duration, channel_id]
      properties:
        type:
          type: string
          enum: [filter, series]
          default: filter
        name:
          type: string
        cron:
          type: string
        duration:
          type: integer
          minimum: 1
        channel_id:
          type: string
        priority:
          type: integer
        max_duration_overflow_minutes:
          type: integer
        filter:
          $ref: "#/components/schemas/Filter"
        filler:
          $ref: "#/components/schemas/FillerConfig"
        series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesConfig"
        fallback:
          $ref: "#/components/schemas/SeriesFallback"
    BlockWrite:
      type: object
      required: [spec]
      properties:
        enabled:
          type: boolean
          default: true
        spec:
          $ref: "#/components/schemas/BlockSpec"
    BlockPatch:
      type: object
      description: >-
        Field-scoped block update. Absent fields are left unchanged; a
        body with no fields set is rejected.
      properties:
        enabled:
          type: boolean
        disabled_until:
          type: string
          format: date-time
          nullable: true
          description: >-
            Take the block dark until this instant, after which it
            returns on its own. An explicit `null` CLEARS the dark window
            and is deliberately distinct from an absent key, which leaves
            it alone -- clearing is the only way an operator brings a
            block back early, and the two cases would be
            indistinguishable otherwise.
    BlockDuplicate:
      type: object
      required: [name]
      description: >-
        The name for the copy. Required, and never defaulted server-side:
        a collision belongs to the caller, who is the one who can see
        what the other block is.
      properties:
        name:
          type: string
          minLength: 1
    BlockRecord:
      type: object
      required: [id, name, enabled, spec, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        spec:
          $ref: "#/components/schemas/BlockSpec"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled_until:
          type: string
          format: date-time
          description: >-
            The instant this block returns to the schedule. Absent when
            there is no dark window. Independent of `enabled`: a block is
            planned only when it is enabled AND not currently dark. A value
            in the past is stale rather than meaningful -- it no longer
            suppresses anything.
        next_occurrence:
          type: string
          format: date-time
          description: >-
            The next instant this block will actually air, honouring both
            `enabled` and `disabled_until`. Absent when the block is
            disabled, when its cron expression never fires, or when the
            expression will not parse. For a dark block this is the first
            occurrence at or after it wakes, not the next raw cron tick --
            a NEXT reading beside a dark block would otherwise be a lie.
    ImportResult:
      type: object
      required: [imported, dry_run]
      properties:
        imported:
          type: integer
        dry_run:
          type: boolean
        names:
          type: array
          items:
            type: string
    GenerateRequest:
      type: object
      properties:
        days:
          type: integer
          default: 7
          minimum: 1
          maximum: 30
        channel_id:
          type: string
    ScheduledSlot:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        block:
          $ref: "#/components/schemas/BlockSpec"
        programs:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledProgram"
    ScheduledProgram:
      type: object
      description: >-
        One planned program inside a slot's lineup, in airing order. A
        typed projection of the internal Tunarr program (the old
        additionalProperties passthrough is gone -- hard swap, pre-v1.0):
        exactly what a guide needs to render a rundown, nothing else.
      required: [title, duration_ms, start_time]
      properties:
        title:
          type: string
        type:
          type: string
          description: >-
            Program kind as Tunarr reports it (movie, episode, flex, ...).
            Omitted when the source program carries no type.
        show:
          type: string
          description: >-
            The show an episode belongs to; omitted for non-episodes and
            when Tunarr reported none. The guide's slot faces lead with
            it -- an episode title alone cannot say which of a block's
            interleaved shows is airing.
        season:
          type: integer
          description: Season number; omitted for non-episodes.
        episode:
          type: integer
          description: Episode number; omitted for non-episodes.
        duration_ms:
          type: integer
          format: int64
        start_time:
          type: string
          format: date-time
          description: >-
            This program's own computed air time -- the slot's start plus
            the durations of every program before it in the lineup.
    Warning:
      type: object
      description: >-
        One occurrence that was planned a time slot but then dropped by
        conflict resolution -- an overlapping occurrence on the same
        channel, resolved by priority (higher wins; equal priority is
        first-come). Previously this was only visible in a server-side
        INFO log line.
      properties:
        block_name:
          type: string
          description: The block whose occurrence was dropped.
        occurrence_start:
          type: string
          format: date-time
          description: That occurrence's cron-computed start time.
        blocking_block_name:
          type: string
          description: The block whose occurrence it lost to.
        channel_id:
          type: string
          description: The channel both occurrences contended for.
        duration_minutes:
          type: integer
          description: How long the dropped occurrence would have run.

    RemovalReport:
      type: object
      required: [airings, emptied_slots]
      description: What a removal touched, per table. On a dry run, what it would touch.
      properties:
        series_states:
          type: integer
          description: Cursors removed. Always 0 for a range deletion.
        airings:
          type: integer
        snapshots:
          type: integer
          description: Occurrence snapshots a key was scrubbed from. Always 0 for a range deletion.
        emptied_slots:
          type: integer
          description: >-
            Occurrences left with no airings. Each keeps a marker saying it
            was committed and produced nothing, so a later apply does not
            re-plan a slot that already went out.
        dry_run:
          type: boolean

    StorageReport:
      type: object
      required: [series_states, airings, sentinels, snapshots, apply_runs, warnings]
      properties:
        series_states:
          type: integer
        airings:
          type: integer
        sentinels:
          type: integer
          description: >-
            Committed-but-empty occurrence markers. Counted apart from
            airings because they cannot be deleted by range.
        snapshots:
          type: integer
        apply_runs:
          type: integer
        warnings:
          type: integer
        oldest_airing:
          type: string
          format: date-time
          nullable: true
        newest_airing:
          type: string
          format: date-time
          nullable: true

    ApplyRun:
      type: object
      required: [id, started_at, source, status]
      description: >-
        One recorded apply. Written before the apply pushes anything to
        Tunarr and finalized afterwards, so a process that dies mid-apply
        still leaves an entry -- which is why status can read "running"
        on a row whose finished_at will never arrive.
      properties:
        id:
          type: string
          description: >-
            The run's identifier, also stamped on the schedule_history
            rows it committed (HistoryEntry.run_id).
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum: [ui, cron, cli, unknown]
        scope:
          type: string
          description: The channel ID the apply was narrowed to, or "" for every channel.
        days:
          type: integer
        status:
          type: string
          enum: [running, ok, error]
        channel_count:
          type: integer
        slot_count:
          type: integer
        error:
          type: string
          description: The failure detail on a run whose status is "error"; "" otherwise.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ApplyRunWarning"

    ApplyRunWarning:
      type: object
      description: >-
        One occurrence this run planned a slot for and then dropped by
        conflict resolution -- the persisted form of Warning.
      properties:
        block_name:
          type: string
        occurrence_start:
          type: string
          format: date-time
        blocking_block_name:
          type: string
        channel_id:
          type: string
        duration_minutes:
          type: integer

    PlanResult:
      type: object
      required: [applied, channels]
      properties:
        applied:
          type: boolean
        channels:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ScheduledSlot"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    HistoryEntry:
      type: object
      properties:
        program_id:
          type: string
        channel_id:
          type: string
        block_name:
          type: string
        scheduled_at:
          type: string
          format: date-time
          description: >-
            The wall-clock instant planning happened -- the value the
            days window is measured against, not the occurrence's own
            start time (that is occurrence_start).
        title:
          type: string
          description: The programme's title. Stored since the enrichment migration, exposed since v0.5.7.
        type:
          type: string
          description: The Tunarr program type (e.g. episode, movie).
        duration_ms:
          type: number
          format: double
        occurrence_start:
          type: string
          format: date-time
          description: >-
            The block occurrence's own cron-computed start time -- the
            identity half of the (block_name, occurrence_start) key.
        sequence:
          type: integer
          description: Playback order within the occurrence.
        run_id:
          type: string
          description: >-
            The apply run that committed this row, or "" for rows written
            before runs were recorded. Runs are not backfilled.
    SeriesState:
      type: object
      required: [show_title, current_season, current_episode]
      properties:
        show_title:
          type: string
        current_season:
          type: integer
        current_episode:
          type: integer
        completed:
          type: boolean
        disabled:
          type: boolean
        run_count:
          type: integer
        last_aired:
          type: string
          format: date-time
          nullable: true
    SeriesStatePatch:
      type: object
      properties:
        current_season:
          type: integer
          minimum: 1
        current_episode:
          type: integer
          minimum: 1
        completed:
          type: boolean
        disabled:
          type: boolean
    Channel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        number:
          type: integer
    Status:
      type: object
      required: [version, tunarr_reachable]
      properties:
        version:
          type: string
        tunarr_reachable:
          type: boolean
        tunarr_error:
          type: string
        blocks:
          type: integer
        last_applied_at:
          description: >-
            When the most recent apply pushed at least one lineup to Tunarr
            (planned pushes and stale-channel clears alike), sampled at
            push time. Omitted when no apply has been recorded yet.
          type: string
          format: date-time
        next_cron_tick:
          description: >-
            When the serve command's cron loop will next generate and apply
            a schedule. Omitted when no cron loop is running (or before its
            first tick has been scheduled).
          type: string
          format: date-time
    MediaShow:
      type: object
      required: [title, episode_count]
      properties:
        title:
          type: string
        episode_count:
          type: integer
    MediaMeta:
      type: object
      required: [genres, ratings]
      properties:
        genres:
          type: array
          items:
            type: string
        ratings:
          type: array
          items:
            type: string
