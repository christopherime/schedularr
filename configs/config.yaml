---
tunarr:
  url: ${SCHEDULARR_BASE_URL_TUNARR}

log:
  level: info
  format: text
  timezone: Local

database: schedularr.db
scheduler_file: scheduler.yaml
# How often `schedularr serve`'s cron loop regenerates and applies the
# schedule. `serve --interval`/`-i` overrides this when passed explicitly.
# The apply window scales with this automatically (floor(interval/24h)+1
# days), so intervals past 24h stay safe -- the pushed lineup always
# outlasts the gap between ticks.
cron_interval: 6h

# retention is per table: each one that grows with time prunes on its own
# clock. history_retention also bounds how far back GET /history?days=N
# can query, and apply_run_retention how far back GET /applies?days=N can
# (see README.md's History Endpoint section)
maintenance:
  history_retention: 168h
  snapshot_retention: 168h
  apply_run_retention: 2160h
  cleanup_enabled: true

api:
  listen: :8484
  # token is left empty here on purpose -- set it via the
  # SCHEDULARR_API_TOKEN environment variable instead of committing a
  # secret to this file. `schedularr serve` refuses to start with an empty
  # token unless --insecure-no-auth is passed.
  token: ""
  insecure_no_auth: false
