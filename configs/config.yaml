---
tunarr:
  url: ${SCHEDULARR_BASE_URL_TUNARR}

log:
  level: info
  format: text
  timezone: Local
  file: schedularr.log

metrics_port: 9090
database: schedularr.db
scheduler_file: scheduler.yaml

cache:
  cache_dir: /tmp/schedularr_cache
  cache_duration: 1h

maintenance:
  cleanup_interval: 24h
  history_retention: 168h
  cleanup_enabled: true
