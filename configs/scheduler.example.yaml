# Scheduler Configuration File
# This file defines scheduling blocks for Tunarr channels
# Version: 1.0

blocks:
  # Morning Cartoons Block
  - name: "Morning Cartoons"
    cron: "0 6 * * *"        # Every day at 6:00 AM
    duration: 240            # 4 hours
    channel_id: "channel-1"
    priority: 10
    filter:
      genres:
        - Animation
        - Family
      ratings:
        - TV-Y
        - TV-G
        - TV-Y7
      max_duration: 30       # Max 30 minutes per episode
      year_from: 2000        # Only modern content

  # Primetime Movies Block
  - name: "Primetime Movies"
    cron: "0 20 * * *"       # Every day at 8:00 PM
    duration: 180            # 3 hours
    channel_id: "channel-1"
    priority: 15
    filter:
      genres:
        - Action
        - Comedy
        - Drama
      ratings:
        - PG
        - PG-13
      min_duration: 80       # At least 80 minutes
      max_duration: 150      # No longer than 2.5 hours

  # Late Night Comedy Block
  - name: "Late Night Comedy"
    cron: "0 23 * * *"       # Every day at 11:00 PM
    duration: 120            # 2 hours
    channel_id: "channel-2"
    priority: 10
    filter:
      genres:
        - Comedy
      max_duration: 90

  # Weekend Sci-Fi Marathon
  - name: "Weekend Sci-Fi"
    cron: "0 14 * * 6,0"     # Saturdays and Sundays at 2:00 PM
    duration: 480            # 8 hours
    channel_id: "channel-3"
    priority: 20
    filter:
      genres:
        - Science Fiction
        - Fantasy
      year_from: 1980
      min_duration: 40

  # Kids Programming
  - name: "Kids Hour"
    cron: "0 16 * * 1-5"     # Weekdays at 4:00 PM
    duration: 60             # 1 hour
    channel_id: "channel-1"
    priority: 12
    filter:
      genres:
        - Animation
        - Family
        - Educational
      ratings:
        - TV-Y
        - TV-Y7
        - G
      max_duration: 25
